<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <!-- Login page -->
    <h1>Login</h1>

    {% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    {% endif %}


    <form method="post">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

    <h1>Edit Student</h1>

    <form method="post">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" value="{{ student.name }}">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ student.email }}">

        <br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ student.age }}">

        <br><br>

        <button type="submit">Update Student</button>
    </form>

</body>
</html>

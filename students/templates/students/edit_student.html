<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<div class="edit-container">

    <div class="edit-card">

        <h2>Edit Student</h2>
        <p class="subtitle">Update student information</p>


        {% if errors %}
          <div class="error-message">
             {% for error in errors %}
                 <p>{{ error }}</p>
        {% endfor %}
           </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Student Name</label>
                <input type="text"
                       name="name"
                       value="{{ student.name }}"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="email"
                       value="{{ student.email }}"
                       required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number"
                       name="age"
                       value="{{ student.age }}"
                       min="1"
                       max="100"
                       required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text"
                       name="course"
                       value="{{ student.course }}"
                       required>
            </div>

            <div class="button-group">

                <button type="submit" class="update-btn">
                    Update Student
                </button>

                <a href="{% url 'student_list' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>

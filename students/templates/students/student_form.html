<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

    <h1>Student Form</h1>
    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <label>Age:</label>
        <input type="number" name="age" min="1" max="100">

        <br><br>

        <button type="submit">Save Student</button>
    </form>

</body>
</html>

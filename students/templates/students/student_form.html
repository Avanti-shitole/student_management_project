{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<div class="form-page">

    <div class="student-form-card">

        <h1>Add Student</h1>
        <p class="form-subtitle">Enter student details</p>

        {% if errors %}
             <div class="error-box">
               {% for error in errors %}
                  <p>{{ error }}</p>
               {% endfor %}
             </div>
       {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    value="{{ name|default:'' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    value="{{ email|default:'' }}"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group age-field">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Age"
                        value="{{ age|default:'' }}"
                        required
                    >
                </div>

                <div class="form-group course-field">
                    <label for="course">Course</label>
                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="Enter course"
                        value="{{ course|default:'' }}"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="save-button">
                Save Student
            </button>

        </form>

        <a href="{% url 'student_list' %}" class="back-link">
            ← Back to Students
        </a>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

    <h1>Student Management System</h1>

    <p>Welcome to Student List</p>
    <h2>Students</h2>

{% for student in students %}
    <p>
        Name: {{ student.name }} |
        Email: {{ student.email }} |
        Age: {{ student.age }}
        <a href="{% url 'edit_student' student.id %}">Edit</a>
    </p>

    

{% empty %}
    <p>No students found.</p>
{% endfor %}
    <a href="{% url 'logout' %}">Logout</a>

</body>
</html>
